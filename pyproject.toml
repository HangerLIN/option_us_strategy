[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "option-us-strategy"
version = "0.1.0"
description = "US options trading platform monorepo with live market data, risk, execution, and analytics services."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
  { name = "Quant Engineering Team" }
]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "sqlalchemy>=2.0.29",
  "psycopg[binary,pool]>=3.1.18",
  "alembic>=1.13.1",
  "pydantic-settings>=2.2.1",
  "redis>=5.0.3",
  "prometheus-client>=0.20.0",
  "pandas>=2.2.2",
  "exchange-calendars>=4.5.3",
  "numpy>=1.26.4",
  "ibapi>=9.81.1.post1",
  "python-dateutil>=2.9.0.post0",
  "structlog>=24.1.0",
  "backtesting>=0.3.3",
  "backtrader>=1.9.78.123",
  "ta>=0.11.0",
  "scipy>=1.13.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "pytest-asyncio>=0.23.6",
  "ruff>=0.4.2",
  "mypy>=1.9.0",
  "flake8>=7.0.0"
]

[project.urls]
homepage = "https://example.com/option-us-strategy"
repository = "https://example.com/option-us-strategy/repo"

[tool.uvicorn]
host = "0.0.0.0"
port = 8000
factory = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "asyncio: mark a test as using asyncio",
]

[tool.setuptools.packages.find]
include = ["apps*", "libs*"]
exclude = ["ibkr_api*"]

[tool.flake8]
max-line-length = 100
extend-ignore = "E203,W503,E501"
exclude = "ibkr_api"

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
extend-exclude = ["ibkr_api"]
