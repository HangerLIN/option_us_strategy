apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      queryTimeout: 60s
      defaultQuery: ''
      incrementalQuerying: true
      incrementalQueryOverlapWindow: 10m
      prometheusType: Prometheus
      prometheusVersion: 2.51.0
      cacheLevel: 'High'
      disableMetricsLookup: false
      customQueryParameters: ''












