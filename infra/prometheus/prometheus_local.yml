global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'option-us-trading'
    environment: 'local'

# Alertmanager配置（本地）
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']
      timeout: 10s

# 告警规则文件（需要使用绝对路径）
rule_files:
  - '/Users/hangerlin/prometheus/rules/*.yml'

scrape_configs:
  # Prometheus自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s
    scrape_timeout: 10s

  # 业务服务 - 实时数据引擎
  - job_name: 'rt_engine'
    static_configs:
      - targets: ['localhost:8002']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 8s

  # 业务服务 - 信号服务
  - job_name: 'signal_svc'
    static_configs:
      - targets: ['localhost:8003']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # 业务服务 - 风控服务
  - job_name: 'risk_svc'
    static_configs:
      - targets: ['localhost:8004']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 8s

  # 业务服务 - 执行服务
  - job_name: 'exec_svc'
    static_configs:
      - targets: ['localhost:8001']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # 业务服务 - 盈亏服务
  - job_name: 'pnl_svc'
    static_configs:
      - targets: ['localhost:8005']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # 业务服务 - 回测API服务
  - job_name: 'backtest_api'
    static_configs:
      - targets: ['localhost:8006']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # Grafana监控
  - job_name: 'grafana'
    static_configs:
      - targets: ['localhost:3000']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s





