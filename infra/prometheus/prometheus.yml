global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'option-us-trading'
    environment: 'production'

# Alertmanager配置
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
      timeout: 10s

# 告警规则文件
rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  # Prometheus自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']
    scrape_interval: 15s
    scrape_timeout: 10s

  # 业务服务 - 实时数据引擎（保留原有采集配置）
  - job_name: 'rt_engine'
    static_configs:
      - targets: ['host.docker.internal:8002']
    metrics_path: '/metrics'
    scrape_interval: 10s  # 更高频率采集实时数据
    scrape_timeout: 8s

  # 业务服务 - 信号服务
  - job_name: 'signal_svc'
    static_configs:
      - targets: ['127.0.0.1:8000']
    relabel_configs:
      - target_label: env
        replacement: ${MONITORING_ENV}
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # 业务服务 - 风控服务
  - job_name: 'risk_svc'
    static_configs:
      - targets: ['127.0.0.1:8002']
    relabel_configs:
      - target_label: env
        replacement: ${MONITORING_ENV}
    metrics_path: '/metrics'
    scrape_interval: 10s  # 风控指标需要更及时
    scrape_timeout: 8s

  # 业务服务 - 执行服务
  - job_name: 'exec_svc'
    static_configs:
      - targets: ['127.0.0.1:8001']
    relabel_configs:
      - target_label: env
        replacement: ${MONITORING_ENV}
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # 业务服务 - 盈亏服务
  - job_name: 'pnl_svc'
    static_configs:
      - targets: ['127.0.0.1:8003']
    relabel_configs:
      - target_label: env
        replacement: ${MONITORING_ENV}
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # 业务服务 - 行情网关
  - job_name: 'md_gw'
    static_configs:
      - targets: ['127.0.0.1:8005']
    relabel_configs:
      - target_label: env
        replacement: ${MONITORING_ENV}
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # 实时引擎指标聚合端口
  - job_name: 'rt_engine_aggregator'
    static_configs:
      - targets: ['127.0.0.1:9106']
    relabel_configs:
      - target_label: env
        replacement: ${MONITORING_ENV}
    scrape_interval: 15s
    scrape_timeout: 10s

  # 实时引擎 API
  - job_name: 'rt_api'
    static_configs:
      - targets: ['127.0.0.1:8007']
    relabel_configs:
      - target_label: env
        replacement: ${MONITORING_ENV}
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # 业务服务 - 回测API服务
  - job_name: 'backtest_api'
    static_configs:
      - targets: ['host.docker.internal:8006']
    metrics_path: '/metrics'
    scrape_interval: 30s  # 回测不需要高频采集
    scrape_timeout: 10s

  # 系统监控 - Node Exporter
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']
    scrape_interval: 30s
    scrape_timeout: 10s

  # 数据库监控 - PostgreSQL Exporter
  - job_name: 'postgres_exporter'
    static_configs:
      - targets: ['postgres_exporter:9187']
    scrape_interval: 30s
    scrape_timeout: 10s

  # Redis监控 - Redis Exporter
  - job_name: 'redis_exporter'
    static_configs:
      - targets: ['redis_exporter:9121']
    scrape_interval: 30s
    scrape_timeout: 10s

  # Alertmanager监控
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
    scrape_interval: 30s
    scrape_timeout: 10s

  # Grafana监控
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # 数据拉取进度监控
  - job_name: 'data_ingest'
    static_configs:
      - targets: ['host.docker.internal:9091']
    metrics_path: '/metrics'
    scrape_interval: 10s  # 高频采集，实时监控进度
    scrape_timeout: 3s
